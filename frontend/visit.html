<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>찾아오는 길 — 최명원 포트폴리오 🌿</title>
  <meta name="description" content="상명대학교 천안캠퍼스 상록관 오시는 길과 날씨 정보, 방문 예약 안내입니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/visit.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <main class="visit-page">
    <a class="visit-back" href="index.html">← 포트폴리오로 돌아가기</a>

    <header class="visit-header">
      <h1>찾아오는 길</h1>
      <p class="visit-sub">아래 주소로 오시면 됩니다. 현재 날씨도 함께 확인해 보세요.</p>
    </header>

    <section class="visit-card">
      <h2>주소</h2>
      <p class="visit-address">상명대학교 천안 (상명대길 31) 상록관</p>
      <div class="visit-map" id="map" role="img" aria-label="상명대학교 천안캠퍼스 상록관 지도"></div>
    </section>

    <section class="visit-card">
      <h2>오늘 날씨</h2>
      <div id="weather-box" class="weather-box">
        <p class="weather-loading">날씨 정보를 불러오는 중...</p>
      </div>
    </section>

    <p class="visit-credit">
      지도 제공: Esri · 날씨 제공: Open-Meteo
    </p>

    <a class="visit-reserve-btn" href="reserve.html">방문 예약하기</a>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/visit.js"></script>
</body>
</html>
