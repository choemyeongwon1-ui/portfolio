# ==========================================
# Render 배포 설정 (Blueprint)
# ------------------------------------------
# Render 대시보드에서 "New +" → "Blueprint" → 이 저장소를 고르면,
# 이 파일을 읽어서 아래 설정 그대로 서버를 만들어 준다.
# 무료 플랜(free)이라 카드 등록 없이 쓸 수 있다.
#
# ★ 딱 하나, ADMIN_PASSWORD_HASH 만 Render 화면에서 직접 입력해야 한다.
#   (sync: false 로 되어 있어서, 이 파일에 값이 없어도 Render가 알아서
#    "값을 입력하세요" 라고 물어본다 — 비밀번호를 파일에 적지 않기 위해서다)
#
# 무료 플랜 참고: 15분 동안 요청이 없으면 서버가 잠들고, 다음 요청이
# 오면 다시 깨어나는 데 30초~1분 정도 걸린다. 방문자가 뜸한 개인
# 포트폴리오에는 문제없지만, 처음 접속이 조금 느릴 수 있다는 뜻이다.
# ==========================================

services:
  - type: web
    name: portfolio-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DATA_SOURCE
        value: "json"
      - key: SERVE_FRONTEND
        value: "false"
      # 방문 예약은 방문자가 실시간으로 보내는 것이라 Render에만 존재한다
      # (프로젝트처럼 "로컬에서 고치고 git push" 방식이 안 통한다) —
      # 그래서 예약 관리만큼은 이 서버의 /api/admin/* 를 켜 둬야 한다.
      # 비밀번호로 보호되는 건 로컬과 동일하다.
      #
      # 다만 프로젝트 수정(글쓰기)은 여전히 내 컴퓨터(npm run dev)에서만 한다 —
      # admin.html은 이 주소를 보지 않고 항상 로컬만 보도록 고정되어 있어서,
      # 이 값을 켜도 프로젝트 데이터의 저장 방식·흐름은 바뀌지 않는다.
      # 예약 상태 변경도 Render 무료 플랜 특성상(잠들었다 깨거나 재배포되면
      # 파일이 초기화됨) 영구 보장은 안 된다 — 이유는 README 참고.
      - key: ENABLE_ADMIN
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_SESSION_MINUTES
        value: "120"
      # 방문 예약 접수 시 이메일로 알림을 보낼 Formspree 엔드포인트.
      # 비밀값이 아니라(프론트엔드 폼 action에 그대로 노출돼도 되는 주소) 여기 직접 적는다.
      - key: FORMSPREE_ENDPOINT
        value: "https://formspree.io/f/mqpeaaej"
      # 비밀번호 해시는 여기 적지 않는다. Render가 만들 때 직접 물어본다.
      - key: ADMIN_PASSWORD_HASH
        sync: false
